name: Build Android APK

on:
  push:
    branches:
      - main  # Change to 'master' if your repository uses master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Compile Website Assets
        run: npm run build

      - name: Sync Web Code to Capacitor
        run: npx cap sync android

      - name: Build Android Debug APK via Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload Generated APK to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mobile-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5