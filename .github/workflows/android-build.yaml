name: Build Android APK

on:
  push:
    branches:
      - main  # Check if your branch is 'main' or 'master'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Set up Java JDK 25 (Latest LTS)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Set up Node.js 24 (Active LTS)
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Compile Website Assets
        run: npm run build

      - name: Sync Web Code to Capacitor
        run: npx cap sync android

      - name: Build Android Debug APK via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Generated APK to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mobile-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5